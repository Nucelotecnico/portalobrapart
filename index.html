<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCTE — Verificação de Conformidade Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1A3A1A;--blue-deep:#2D5A2D;--blue-elec:#3A8A3A;
  --blue-light:#F0FAF0;--white:#FFFFFF;--amber:#E8B900;
  --green:#2E7D32;--green-mid:#4CAF50;--green-light:#A5D6A7;
  --red:#C0392B;--gray:#6B7280;--gray-light:#E5E7EB;
  --gray-border:#D1D5DB;--text:#111827;--text-sub:#4B5563;
  --sidebar-w:280px;--radius:10px;
  --shadow:0 1px 4px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--blue-light);color:var(--text)}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:var(--sidebar-w);background:var(--navy);height:100vh;display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sidebar-header{border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-header-wave{background:linear-gradient(135deg,#2D5A2D 0%,#3A8A3A 100%);padding:22px 20px 18px}
.sidebar-logo{font-size:10px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:6px}
.sidebar-logo-cemig{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.5px;font-style:italic}
.sidebar-logo-cemig span{color:var(--green-light)}
.sidebar-title{font-size:13px;font-weight:600;color:rgba(255,255,255,.8);margin-top:8px}
.sidebar-sub{font-size:11px;color:rgba(255,255,255,.4);padding:8px 20px 14px}
.steps-nav{padding:24px 20px;flex:1;position:relative}
.steps-line{position:absolute;left:39px;top:36px;bottom:36px;width:2px;background:rgba(255,255,255,.1)}
.steps-line-fill{position:absolute;left:0;top:0;width:100%;background:var(--green-mid);transition:height .4s ease}
.step-item{display:flex;align-items:flex-start;gap:14px;padding:5px 0;cursor:pointer;position:relative;z-index:1}
.step-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,.2);background:var(--navy);display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:2px}
.step-item.done .step-dot{background:var(--green-mid);border-color:var(--green-mid)}
.step-item.active .step-dot{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 4px rgba(232,185,0,.2)}
.step-dot svg{display:none}.step-item.done .step-dot svg{display:block}
.step-label{font-size:12px;color:rgba(255,255,255,.4);line-height:1.3;transition:color .2s;padding:2px 0}
.step-num{font-size:10px;color:rgba(255,255,255,.25);display:block;margin-bottom:1px;font-family:'JetBrains Mono'}
.step-item.active .step-label{color:#fff;font-weight:600}
.step-item.done .step-label{color:rgba(255,255,255,.65)}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08)}
.btn-list{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.8);border-radius:8px;padding:10px;font-size:13px;font-weight:500;transition:background .15s}
.btn-list:hover{background:rgba(255,255,255,.12)}
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.main-header{background:#fff;border-bottom:1px solid var(--gray-light);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.main-header h2{font-size:17px;font-weight:700;color:var(--navy)}
.step-counter{font-size:12px;color:var(--gray);font-family:'JetBrains Mono'}
.main-content{padding:28px 32px;flex:1;max-width:960px}
.card{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:18px}
.card-title{font-size:12px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.8px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.card-title::after{content:'';flex:1;height:1px;background:var(--gray-light)}
.field-grid{display:grid;gap:14px}
.field-grid.cols-2{grid-template-columns:1fr 1fr}
.field-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.field-group{display:flex;flex-direction:column;gap:5px}
.field-group label{font-size:11px;font-weight:600;color:var(--text-sub)}
.field-group input,.field-group select,.field-group textarea{border:1.5px solid var(--gray-border);border-radius:8px;padding:9px 11px;font-size:13px;color:var(--text);background:#fff;transition:border-color .15s}
.field-group input:focus,.field-group select:focus,.field-group textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(46,125,50,.1)}
.field-group.mono input{font-family:'JetBrains Mono';font-size:12px}
.field-group textarea{resize:vertical;min-height:110px;line-height:1.6}
.radio-group{display:flex;flex-wrap:wrap;gap:10px}
.radio-btn{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1.5px solid var(--gray-border);border-radius:8px;cursor:pointer;font-size:13px;transition:all .15s;user-select:none}
.radio-btn input{display:none}
.radio-btn.active{border-color:var(--green);background:var(--blue-light);color:var(--green);font-weight:600}
.radio-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--gray-border);transition:all .15s;flex-shrink:0}
.radio-btn.active .radio-dot{border-color:var(--green);background:var(--green);box-shadow:inset 0 0 0 2px #fff}
.result-select{display:flex;gap:12px;flex-wrap:wrap}
.result-card{border:2px solid var(--gray-border);border-radius:10px;padding:14px 22px;cursor:pointer;font-weight:700;font-size:14px;transition:all .2s}
.result-card.atende.active{border-color:var(--green);background:#F0FFF6;color:var(--green)}
.result-card.nao-atende.active{border-color:var(--red);background:#FFF0F0;color:var(--red)}
.dyn-table{width:100%;border-collapse:collapse;margin-bottom:10px}
.dyn-table th{background:var(--blue-light);color:var(--blue-deep);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;text-align:left;border-bottom:2px solid var(--green-light)}
.dyn-table td{padding:7px 8px;border-bottom:1px solid var(--gray-light);vertical-align:middle}
.dyn-table td input,.dyn-table td select{width:100%;border:1px solid transparent;border-radius:4px;padding:5px 7px;font-size:12px;background:transparent;font-family:inherit}
.dyn-table td input:focus,.dyn-table td select:focus{border-color:var(--green);background:#fff;outline:none}
.dyn-table td.mono input{font-family:'JetBrains Mono';font-size:11px}
.btn-remove-row{background:none;border:none;color:#ccc;font-size:15px;padding:3px 7px;transition:color .15s}
.btn-remove-row:hover{color:var(--red)}
.btn-add-row{background:none;border:1.5px dashed var(--gray-border);border-radius:7px;padding:8px 14px;font-size:12px;color:var(--gray);transition:all .15s;margin-top:4px;display:inline-flex;align-items:center;gap:6px}
.btn-add-row:hover{border-color:var(--green);color:var(--green)}
.equipe-card{background:#fff;border:1.5px solid var(--gray-border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.equipe-header{background:var(--blue-light);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--green-light)}
.equipe-header h4{font-size:13px;font-weight:700;color:var(--blue-deep)}
.btn-remove-equipe{background:none;border:none;color:#ccc;font-size:17px;transition:color .15s}
.btn-remove-equipe:hover{color:var(--red)}
.equipe-body{padding:18px}
.equipe-veiculo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.equipe-section-label{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--gray-light)}
.btn-add-equipe{width:100%;background:none;border:2px dashed var(--green);border-radius:10px;padding:14px;font-size:13px;color:var(--green);font-weight:600;transition:background .15s;margin-top:8px}
.btn-add-equipe:hover{background:var(--blue-light)}
/* Fotos */
.fotos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.foto-item{position:relative}
.foto-box{border:2px dashed var(--gray-border);border-radius:10px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;background:#FAFAFA}
.foto-box:hover{border-color:var(--green);background:var(--blue-light)}
.foto-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;opacity:0;transition:opacity .2s;font-size:12px;gap:6px}
.foto-box:hover .foto-overlay{opacity:1}
.foto-label-input{width:100%;margin-top:6px;border:1.5px solid var(--gray-border);border-radius:6px;padding:6px 8px;font-size:12px;font-weight:600;color:var(--text)}
.foto-label-input:focus{outline:none;border-color:var(--green)}
.btn-remove-foto{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.foto-item:hover .btn-remove-foto{opacity:1}
input[type=file]{display:none}
/* Documentação obrigatória */
.doc-table{width:100%;border-collapse:collapse}
.doc-table th{background:var(--green);color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;padding:8px 10px;text-align:left}
.doc-table th.center{text-align:center;width:60px}
.doc-table td{padding:10px;border-bottom:1px solid var(--gray-light);font-size:12px;vertical-align:top}
.doc-table tr:nth-child(even) td{background:var(--blue-light)}
.doc-table td.item-num{font-weight:700;color:var(--green);width:36px;text-align:center}
.doc-table td.item-doc{font-weight:700;color:var(--text);width:160px}
.doc-table td.item-desc{color:var(--text-sub);line-height:1.5}
.doc-table td.item-status{text-align:center;vertical-align:middle}
.status-toggle{display:flex;gap:6px;justify-content:center}
.status-btn{border:1.5px solid var(--gray-border);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;background:none;transition:all .15s;cursor:pointer}
.status-btn.c.active{border-color:var(--green);background:#E8FFF3;color:var(--green)}
.status-btn.nc.active{border-color:var(--red);background:#FFE8E8;color:var(--red)}
/* Nav */
.nav-footer{padding:20px 32px;border-top:1px solid var(--gray-light);background:#fff;display:flex;align-items:center;justify-content:space-between;position:sticky;bottom:0}
.btn-back{background:none;border:1.5px solid var(--gray-border);border-radius:8px;padding:9px 18px;font-size:13px;font-weight:500;color:var(--text-sub);transition:all .15s}
.btn-back:hover{border-color:var(--navy);color:var(--navy)}
.btn-next{background:var(--green);color:#fff;border:none;border-radius:8px;padding:10px 26px;font-size:13px;font-weight:600;transition:background .15s;display:flex;align-items:center;gap:8px}
.btn-next:hover{background:#1B5E20}
.btn-generate{background:var(--green);color:#fff;border:none;border-radius:8px;padding:10px 26px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.progress-info{font-size:11px;color:var(--gray);text-align:center}
/* Modal */
#modal-overlay{position:fixed;inset:0;background:rgba(10,22,40,.7);z-index:500;display:none;align-items:center;justify-content:center}
#modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:16px;max-width:780px;width:95%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:18px 26px;border-bottom:1px solid var(--gray-light);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:16px;font-weight:700;color:var(--navy)}
.btn-close{background:none;border:none;font-size:22px;color:var(--gray);transition:color .15s;cursor:pointer}
.modal-body{overflow-y:auto;padding:18px 26px;flex:1}
.report-list-item{border:1.5px solid var(--gray-border);border-radius:10px;padding:14px 18px;margin-bottom:10px;transition:all .15s;display:flex;align-items:center;justify-content:space-between}
.report-list-item:hover{border-color:var(--green);background:var(--blue-light)}
.report-list-item .info h4{font-size:13px;font-weight:700;color:var(--navy)}
.report-list-item .info p{font-size:11px;color:var(--gray);margin-top:2px;font-family:'JetBrains Mono'}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.badge.atende{background:#E8FFF3;color:var(--green)}
.badge.nao-atende{background:#FFE8E8;color:var(--red)}
.badge.rascunho{background:#FFF8E1;color:#B45309}
.report-actions{display:flex;gap:8px;align-items:center}
.btn-sm{padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;border:none;transition:all .15s;cursor:pointer}
.btn-sm.outline{background:none;border:1.5px solid var(--gray-border);color:var(--text-sub)}
.btn-sm.outline:hover{border-color:var(--green);color:var(--green)}
.btn-sm.danger{background:#FFE8E8;color:var(--red)}
.btn-sm.primary{background:var(--green);color:#fff}
/* Import xlsx */
.import-box{border:2px dashed var(--green);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:background .15s;margin-bottom:16px}
.import-box:hover{background:var(--blue-light)}
.import-box p{font-size:13px;color:var(--green);font-weight:600;margin-top:8px}
.import-box span{font-size:11px;color:var(--gray)}
/* Toast */
#toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;transform:translateY(80px);opacity:0;transition:all .25s;z-index:9999;max-width:320px}
#toast.show{transform:translateY(0);opacity:1}
#toast.success{background:var(--green)}
#toast.error{background:var(--red)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){#sidebar{display:none}.main-content{padding:16px}.field-grid.cols-2,.field-grid.cols-3{grid-template-columns:1fr}.equipe-veiculo{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-wave">
        <div class="sidebar-logo">CEMIG DISTRIBUIÇÃO S.A.</div>
        <div class="sidebar-logo-cemig"><span>C</span>EMIG</div>
        <div class="sidebar-title">Verificação de Conformidade Técnica</div>
      </div>
      <div class="sidebar-sub" id="vcte-subtitle">Novo relatório</div>
    </div>
    <div class="steps-nav">
      <div class="steps-line"><div class="steps-line-fill" id="steps-progress-bar"></div></div>
      <div id="steps-list"></div>
    </div>
    <div class="sidebar-footer">
      <button class="btn-list" onclick="openModal()">📋 Meus relatórios</button>
    </div>
  </div>
  <div id="main">
    <div class="main-header">
      <h2 id="step-title">Identificação do Relatório</h2>
      <span class="step-counter" id="step-counter">Etapa 1 de 11</span>
    </div>
    <div class="main-content" id="step-content"></div>
    <div class="nav-footer">
      <button class="btn-back" id="btn-back" onclick="prevStep()">← Voltar</button>
      <div class="progress-info" id="progress-info">Rascunho salvo automaticamente</div>
      <button class="btn-next" id="btn-next" onclick="nextStep()">Próximo →</button>
    </div>
  </div>
</div>
<div id="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3>📋 Meus Relatórios</h3>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;justify-content:flex-end;margin-bottom:14px">
        <button class="btn-sm primary" onclick="newReport();closeModal()">+ Novo relatório</button>
      </div>
      <div id="reports-list"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
// ===== INDEXEDDB — suporte a fotos e laudos em PDF sem limite de 5MB =====
const DB_NAME='vcte_db', DB_VERSION=1, STORE='relatorios';
let _db=null;

function dbOpen(){
  return new Promise((res,rej)=>{
    if(_db)return res(_db);
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(STORE))
        db.createObjectStore(STORE,{keyPath:'id'});
    };
    req.onsuccess=e=>{_db=e.target.result;res(_db)};
    req.onerror=e=>rej(e.target.error);
  });
}
async function dbGetAll(){
  const db=await dbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readonly');
    const req=tx.objectStore(STORE).getAll();
    req.onsuccess=()=>res(req.result||[]);
    req.onerror=e=>rej(e.target.error);
  });
}
async function dbGet(id){
  const db=await dbOpen();
  return new Promise((res,rej)=>{
    const req=db.transaction(STORE,'readonly').objectStore(STORE).get(id);
    req.onsuccess=()=>res(req.result||null);
    req.onerror=e=>rej(e.target.error);
  });
}
async function dbUpsert(record){
  const db=await dbOpen();
  return new Promise((res,rej)=>{
    const req=db.transaction(STORE,'readwrite').objectStore(STORE).put(record);
    req.onsuccess=()=>res();
    req.onerror=e=>rej(e.target.error);
  });
}
async function dbDelete(id){
  const db=await dbOpen();
  return new Promise((res,rej)=>{
    const req=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);
    req.onsuccess=()=>res();
    req.onerror=e=>rej(e.target.error);
  });
}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}

window.addEventListener('DOMContentLoaded',async()=>{
  await dbOpen();
  renderSidebar();renderStep();
});

// ===== STATE =====
let currentStep=0,currentReportId=null,saveTimer=null;

const DOC_ITEMS=[
  {num:1,doc:'Ficha de Registro e CTPS - para compor dossiê do funcionário',desc:'Entregar Xerox legível e documento original para fins de autenticação. Ficha de registro, Carteira de Trabalho e Previdência Social com cópia das seguintes partes: Identificação, contrato de trabalho e anotação que comprove experiência profissional.'},
  {num:2,doc:'Relação de todos os Empregados DA EMPRESA e Relação de Empregados que compõe a Equipe de obras do PART',desc:'Deve ser em papel timbrado com a relação nominal dos empregados que trabalharão durante o mês, indicando nomes, cargos/função, CPF e número da CTPS.'},
  {num:3,doc:'Responsável Técnico',desc:'Entregar cópia legível e apresentar documento original para fins de autenticação ou documento autenticado em cartório. Responsável Técnico - RT.'},
  {num:4,doc:'Registro junto ao conselho de classe competente (CREA/CFT)',desc:'Entregar cópia legível e apresentar documento original para fins de autenticação ou documento autenticado em cartório ou cópia do registro quando CFT. Anotação de Responsabilidade Técnica - ART, devidamente preenchido e assinada, conforme CONFEA e CREA e com detalhamento dos serviços prestados. No caso do CFT, apresentar o Termo de Responsabilidade Técnica - TRT.'},
  {num:5,doc:'Certificados dos treinamentos exigidos por função, conforme discriminado na Especificação Técnica ET-VCTE-GM-0832 e "Matriz de Treinamento" – UNIVERCEMIG.',desc:'Entregar cópia legível e apresentar documentos originais para fins de autenticação.'},
  {num:6,doc:'ART SSO & BE',desc:'Entregar copia legível e apresentar documento original para fins de autenticação ou documento autenticado em cartório. Anotação de Responsabilidade Técnica - ART, devidamente preenchido, assinado e com guia de pagamento (CREA).ART conforme CONFEA e CREA; detalhamento dos serviços relativos à Segurança e Saúde Ocupacional e Bem Estar – SSO & BE.'},

// Import XLSX
function importXlsx(inp){
  const file=inp.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      parseXlsxRows(rows);
      renderTbodyEstrutural();renderEquipes();
      showToast('Excel importado com sucesso! ✓','success');
    }catch(err){showToast('Erro ao ler o arquivo: '+err.message,'error')}
  };
  reader.readAsArrayBuffer(file);inp.value='';
}

function parseXlsxRows(rows){
  // Mapeamento exato confirmado via openpyxl:
  // col[0]=id equipe, col[1]=rótulo, col[2]=valor_esq, col[3]=rótulo_dir, col[4]=valor_dir, col[5]=ctps
  const s=v=>String(v==null?'':v).trim();

  // Fornecedor (col[2])
  for(let r=0;r<rows.length;r++){
    if(s(rows[r][0]).includes('FORNECEDOR SOLICITANTE:')){
      const v=s(rows[r][2]);
      if(v&&!formData.razao_social)formData.razao_social=v;
      break;
    }
  }

  // Equipe Estrutural: col[1]=nome, col[3]=funcao, col[4]=cpf, col[5]=ctps
  const estrutural=[];
  let inEstr=false;
  for(let r=0;r<rows.length;r++){
    const c0=s(rows[r][0]);
    if(c0==='EQUIPE ESTRUTURAL'){inEstr=true;continue}
    if(inEstr&&/^EQUIPE\s+\d/i.test(c0))break;
    if(inEstr){
      const nome=s(rows[r][1]);
      const funcao=s(rows[r][3]);
      const cpf=s(rows[r][4]);
      const ctps=s(rows[r][5]);
      if(nome&&funcao&&funcao!=='Função')
        estrutural.push({nome,funcao,cpf,ctps});
    }
  }
  if(estrutural.length>0)formData.equipe_estrutural=estrutural;

  // Equipes de Campo: col[2]=valor_esq, col[4]=valor_dir em cada linha do bloco
  const equipes=[];const seen=new Set();
  for(let r=0;r<rows.length;r++){
    const c0=s(rows[r][0]);
    const m=c0.match(/^EQUIPE\s+(\d+)$/i);
    if(!m)continue;
    const num=parseInt(m[1]);
    if(seen.has(num))continue;
    seen.add(num);
    const eq=newEquipe(num);
    eq.placa         = s(rows[r]?.[2]);
    eq.fab_cab       = s(rows[r]?.[4]);
    eq.ano_veiculo   = s(rows[r+1]?.[2]);
    eq.ano_cab       = s(rows[r+1]?.[4]);
    eq.marca         = s(rows[r+2]?.[2]);
    eq.fab_guindauto = s(rows[r+2]?.[4]);
    eq.modelo        = s(rows[r+3]?.[2]);
    eq.ano_guindauto = s(rows[r+3]?.[4]);
    eq.locado        = s(rows[r+4]?.[2])||'NÃO';
    eq.fab_cesto     = s(rows[r+4]?.[4])||'NÃO SE APLICA';
    // Membros
    for(let k=r+5;k<Math.min(r+25,rows.length);k++){
      if(s(rows[k]?.[1]).toLowerCase().includes('componentes da equipe')){
        const membros=[];
        for(let m2=k+2;m2<rows.length;m2++){
          const mr=rows[m2];
          if(/^EQUIPE\s+\d/i.test(s(mr?.[0])))break;
          const nome=s(mr?.[1]);const funcao=s(mr?.[3]);
          const cpf=s(mr?.[4]);const ctps=s(mr?.[5]);
          if(nome||funcao)membros.push({nome,funcao,cpf,ctps});
        }
        if(membros.length>0)eq.membros=membros;
        break;
      }
    }
    equipes.push(eq);
  }
  if(equipes.length>0)formData.equipes_campo=equipes;
}

// STEP 13 — Assinaturas
function renderStep13(c){
  c.innerHTML=`<div class="card">
  <div class="card-title">12.0 Equipe Responsável pelo Evento</div>
  <table class="dyn-table"><thead><tr><th>Nome</th><th>Regional / Área</th><th style="width:36px"></th></tr></thead>
  <tbody id="tbody-equipe-envolvida"></tbody></table>
  <button class="btn-add-row" onclick="addMembroEnvolvido()">+ Adicionar membro</button>
  </div>
  <div class="card">
  <div class="card-title">Assinaturas</div>
  <div class="field-grid cols-2">
    <div class="field-group"><label>Representante CEMIG Distribuição S.A.</label><input type="text" id="responsavel_cemig" value="${esc(formData.responsavel_cemig)}" placeholder="Nome do representante"></div>
    <div class="field-group"><label>Representante da Empresa Verificada</label><input type="text" id="responsavel_empresa" value="${esc(formData.responsavel_empresa)}" placeholder="Nome do representante"></div>
  </div></div>`;
  renderTbodyEnvolvidos();
}
function renderTbodyEnvolvidos(){
  const tb=document.getElementById('tbody-equipe-envolvida');if(!tb)return;
  tb.innerHTML=formData.equipe_envolvida.map((m,i)=>`<tr>
    <td><input type="text" value="${esc(m.nome)}" onchange="formData.equipe_envolvida[${i}].nome=this.value" placeholder="Nome completo"></td>
    <td><input type="text" value="${esc(m.regional)}" onchange="formData.equipe_envolvida[${i}].regional=this.value" placeholder="Ex: PE/EM"></td>
    <td><button class="btn-remove-row" onclick="removeEnvolvido(${i})">✕</button></td>
  </tr>`).join('');
}
function addMembroEnvolvido(){formData.equipe_envolvida.push({nome:'',regional:''});renderTbodyEnvolvidos()}
function removeEnvolvido(i){formData.equipe_envolvida.splice(i,1);renderTbodyEnvolvidos()}

// COLLECT
function collectCurrentStep(){
  const get=id=>{const el=document.getElementById(id);return el?el.value:undefined};
  const maps=[
    ['razao_social','cnpj','numero_vcte','ano','data_inspecao','data_relatorio'], // 0
    ['endereco','pessoa_contato','telefone','email'],                              // 1
    [],                                                                            // 2 radios
    ['num_uebs'],                                                                  // 3
    [],                                                                            // 4 fotos
    [],                                                                            // 5 equipes
    ['doc_obs'],                                                                   // 6
    ['observacoes'],                                                               // 7
    ['obs_ferramental'],                                                           // 8
    ['desc_veiculos_obs'],                                                         // 9
    ['obs_vcte'],                                                                  // 10
    [],                                                                            // 11 laudos
    ['conclusao'],                                                                 // 12
    ['responsavel_cemig','responsavel_empresa']                                    // 13
  ];
  (maps[currentStep]||[]).forEach(f=>{const v=get(f);if(v!==undefined)formData[f]=v});
  if(currentStep===2){
    const t=document.querySelector('input[name="tipo"]:checked');if(t)formData.tipo_avaliacao=t.value;
    const g=document.querySelector('input[name="grupo"]:checked');if(g)formData.grupo=g.value;
  }
  autoSave();
}

function nextStep(){collectCurrentStep();if(currentStep<STEPS.length-1){currentStep++;renderSidebar();renderStep();document.getElementById('main').scrollTo(0,0)}}
function prevStep(){collectCurrentStep();if(currentStep>0){currentStep--;renderSidebar();renderStep();document.getElementById('main').scrollTo(0,0)}}
function autoSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveReport,1500)}

async function saveReport(){
  try{
    if(!currentReportId)currentReportId=genId();
    const record={
      id:currentReportId,
      numero_vcte:formData.numero_vcte||'',
      ano:formData.ano||'',
      razao_social:formData.razao_social||'',
      cnpj:formData.cnpj||'',
      resultado:formData.resultado||'rascunho',
      updated_at:new Date().toISOString(),
      dados:formData  // inclui fotos base64 e laudos PDF completos
    };
    await dbUpsert(record);
    document.getElementById('progress-info').textContent='✓ Salvo em '+new Date().toLocaleTimeString('pt-BR');
  }catch(e){
    document.getElementById('progress-info').textContent='⚠ Erro ao salvar';
    console.error('Erro ao salvar:',e);
  }
}

async function openModal(){
  document.getElementById('modal-overlay').classList.add('open');
  const listEl=document.getElementById('reports-list');
  listEl.innerHTML='<p style="color:var(--gray);text-align:center;padding:40px"><span class="spin" style="border-color:rgba(0,0,0,.15);border-top-color:var(--green);display:inline-block"></span></p>';
  try{
    const data=await dbGetAll();
    // Sort by updated_at desc
    data.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
    if(!data.length){listEl.innerHTML='<p style="color:var(--gray);text-align:center;padding:40px">Nenhum relatório encontrado.</p>';return}
    listEl.innerHTML=data.map(r=>`<div class="report-list-item">
      <div class="info">
        <h4>${r.razao_social||'Sem título'}${r.numero_vcte?` — VCTE Nº ${r.numero_vcte}`:''}${r.ano?` / ${r.ano}`:''}</h4>
        <p>CNPJ: ${r.cnpj||'—'} · ${new Date(r.updated_at).toLocaleString('pt-BR')}</p>
      </div>
      <div class="report-actions">
        <span class="badge ${r.resultado==='ATENDE'?'atende':r.resultado==='NÃO ATENDE'?'nao-atende':'rascunho'}">${r.resultado||'RASCUNHO'}</span>
        <button class="btn-sm outline" onclick="loadReport('${r.id}')">Abrir</button>
        <button class="btn-sm danger" onclick="deleteReport('${r.id}',event)">Excluir</button>
      </div></div>`).join('');
  }catch(e){
    listEl.innerHTML=`<p style="color:var(--red);text-align:center;padding:40px">Erro ao carregar: ${e.message}</p>`;
  }
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open')}

async function loadReport(id){
  try{
    const rec=await dbGet(id);
    if(!rec){showToast('Relatório não encontrado.','error');return}
    formData={...JSON.parse(JSON.stringify(DEFAULT_DATA)),...rec.dados};
    currentReportId=id;currentStep=0;closeModal();renderSidebar();renderStep();
    showToast('Relatório carregado ✓ (com fotos e laudos)','success');
  }catch(e){showToast('Erro ao carregar: '+e.message,'error')}
}

async function deleteReport(id,e){
  e.stopPropagation();
  if(!confirm('Excluir este relatório permanentemente?'))return;
  try{
    await dbDelete(id);
    if(currentReportId===id)newReport();
    openModal();showToast('Relatório excluído.','success');
  }catch(e){showToast('Erro ao excluir.','error')}
}

function newReport(){formData=JSON.parse(JSON.stringify(DEFAULT_DATA));currentReportId=null;currentStep=0;renderSidebar();renderStep()}

  function addPageHeader(){
    // Fundo verde escuro
    doc.setFillColor(NAVY.r,NAVY.g,NAVY.b);doc.rect(0,0,pw,HDR_H,'F');
    // Logo CEMIG colado na borda esquerda
    try{doc.addImage(LOGO_DATA,'PNG',1,0.8,20,10.4)}catch(e){}
    // Textos começam após o logo (ml+22)
    const tx=ml+8;
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(255,255,255);
    doc.text('RELATÓRIO DE VERIFICAÇÃO E CONFORMIDADE TÉCNICA — VCTE',tx,5);
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(GLIGHT.r,GLIGHT.g,GLIGHT.b);
    const rsShort=doc.splitTextToSize(formData.razao_social||'',pw-mr-tx-40)[0]||'';
    doc.text(rsShort,pw-mr,5,{align:'right'});
    doc.setLineWidth(0.2);y=HDR_H+5;
  }
  function addPage(){doc.addPage();addPageHeader()}
  function checkY(n){if(y+n>ph-14)addPage()}

  function secTitle(t){
    checkY(14);
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(NAVY.r,NAVY.g,NAVY.b);
    doc.text(t,ml,y);
    doc.setDrawColor(GREEN.r,GREEN.g,GREEN.b);doc.setLineWidth(0.5);
    doc.line(ml,y+2,ml+W,y+2);
    doc.setLineWidth(0.2);y+=10;
  }
  function tHeader(cols,widths){
    checkY(9);
    doc.setFillColor(GREEN.r,GREEN.g,GREEN.b);doc.rect(ml,y,W,8,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(255,255,255);
    let x=ml+2;cols.forEach((col,i)=>{doc.text(col,x,y+5.5);x+=widths[i]});y+=8;
  }
  function tRow(cells,widths,even){
    const rH=7;checkY(rH+1);
    if(even){doc.setFillColor(GBKG.r,GBKG.g,GBKG.b);doc.rect(ml,y,W,rH,'F')}
    doc.setDrawColor(210,230,210);doc.line(ml,y+rH,ml+W,y+rH);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(30,30,30);
    let x=ml+2;cells.forEach((cell,i)=>{
      const txt=doc.splitTextToSize(String(cell||''),widths[i]-4)[0]||'';
      doc.text(txt,x,y+5);x+=widths[i];
    });y+=rH;
  }
  function infoRow2(label,value){
    const rH=8;checkY(rH);
    doc.setFillColor(220,240,220);doc.rect(ml,y,58,rH,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(GREEN.r,GREEN.g,GREEN.b);
    doc.text(label,ml+2,y+5.5);
    doc.setFont('helvetica','normal');doc.setTextColor(30,30,30);
    doc.text(String(value||'—'),ml+60,y+5.5);

  function idRow(label,value){
    const valLines=doc.splitTextToSize(String(value||'—'),W-6);
    const valH=Math.max(8,valLines.length*5.5+3);
    // Linha do rótulo
    doc.setFillColor(GREEN.r,GREEN.g,GREEN.b);doc.rect(ml,y,W,7,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(255,255,255);

  doc.text('HABILITAÇÃO CADASTRAL',ml+W*0.75,y+12,{align:'center'});
  doc.setFontSize(14);doc.setTextColor(isAt?GREEN.r:RED.r,isAt?GREEN.g:RED.g,isAt?GREEN.b:RED.b);
  doc.text(formData.resultado||'—',ml+W*0.75,y+20,{align:'center'});
  doc.setLineWidth(0.2);y+=30;

  // Section 4 - Fotos empresa
  const fotosComSrc=formData.fotos.filter(f=>f.src);
  if(fotosComSrc.length>0){
    addPage();secTitle('4.0   APRESENTAÇÃO DA EMPRESA');
    for(let fi=0;fi<fotosComSrc.length;fi++){
      const foto=fotosComSrc[fi];
      checkY(96);
      try{
        doc.addImage(foto.src,'JPEG',ml,y,W,78);
        y+=82; // 78 image + 4 gap before legend
        if(foto.legenda){
          doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(NAVY.r,NAVY.g,NAVY.b);
          doc.text(foto.legenda,pw/2,y,{align:'center'});
          y+=12;
        }
      }catch(e){}
    }
  }

  // Section 5 - Equipes (sem sub-header OBRAS PART)
  addPage();secTitle('5.0   INFORMAÇÕES SOBRE EQUIPE E VEÍCULOS');
  infoRow2('FORNECEDOR SOLICITANTE:',formData.razao_social);y+=4;

  // Equipe Estrutural table
  doc.setFillColor(GREEN.r,GREEN.g,GREEN.b);doc.rect(ml,y,W,8,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(255,255,255);
  doc.text('EQUIPE ESTRUTURAL',ml+2,y+5.5);y+=8;
  const esW=[W*0.38,W*0.32,W*0.17,W*0.13];
  tHeader(['Nome','Função','CPF','CTPS'],esW);
  formData.equipe_estrutural.forEach((m,i)=>tRow([m.nome,m.funcao,m.cpf,m.ctps],esW,i%2===0));
  y+=6;

  // Equipes de campo
  formData.equipes_campo.forEach((eq,ei)=>{
    checkY(16);
    doc.setFillColor(GREEN2.r,GREEN2.g,GREEN2.b);doc.rect(ml,y,W,8,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(255,255,255);
    doc.text(`EQUIPE ${ei+1}`,ml+2,y+5.5);y+=8;
    // Vehicle data
    const vW=[W*0.22,W*0.22,W*0.28,W*0.28];
    tHeader(['Placa do Veículo:','Ano do Veículo:','Marca:','Modelo:'],vW);
    tRow([eq.placa,eq.ano_veiculo,eq.marca,eq.modelo],vW,false);y+=2;
    const vW2=[W*0.28,W*0.22,W*0.25,W*0.25];
    tHeader(['Veículo Locado?','Fab. Cesto Acoplado:','Fabricante Cab. Aux.:','Ano Fab./Nº de Série:'],vW2);
    tRow([eq.locado,eq.fab_cesto,eq.fab_cab,eq.ano_cab],vW2,false);y+=2;
    const vW3=[W*0.38,W*0.32,W*0.3];
    tHeader(['Fabricante Guindauto/Modelo','Ano Fab./Nº de Série Guind.',''],vW3);
    tRow([eq.fab_guindauto,eq.ano_guindauto,''],vW3,false);y+=4;
    // Members
    checkY(10);
    doc.setFillColor(GBKG.r,GBKG.g,GBKG.b);doc.rect(ml,y,W,7,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(NAVY.r,NAVY.g,NAVY.b);
    doc.text('Componentes da equipe de construção apresentada:',ml+2,y+5);y+=7;
    const mW=[W*0.38,W*0.22,W*0.22,W*0.18];
    tHeader(['Nome','Função','CPF','CTPS'],mW);
    eq.membros.forEach((m,i)=>tRow([m.nome,m.funcao,m.cpf,m.ctps],mW,i%2===0));
    y+=6;
  });

  // Section 6 - Documentação Obrigatória
  addPage();secTitle('6.0   DOCUMENTAÇÃO OBRIGATÓRIA, VCTE-GM-0832, REV. "I" 09/2022:');
  // Doc table header
  const dW=[12,48,W-12-48-16-16,16,16];
  doc.setFillColor(GREEN.r,GREEN.g,GREEN.b);doc.rect(ml,y,W,8,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(255,255,255);
  doc.text('ITEM',ml+2,y+5.5);
  doc.text('DOCUMENTO',ml+14,y+5.5);
  doc.text('DESCRIÇÃO E ESPECIFICAÇÕES DA ENTREGA',ml+64,y+5.5);
  doc.text('C',ml+W-28,y+5.5,{align:'center'});
  doc.text('NC',ml+W-12,y+5.5,{align:'center'});
  y+=8;
  DOC_ITEMS.forEach((item,i)=>{
    const descLines=doc.splitTextToSize(item.desc,dW[2]-4);
    const docLines=doc.splitTextToSize(item.doc,dW[1]-4);
    const maxLines=Math.max(descLines.length,docLines.length,1);
    const rowH=maxLines*4.5+5;checkY(rowH+2);
    if(i%2===0){doc.setFillColor(GBKG.r,GBKG.g,GBKG.b);doc.rect(ml,y,W,rowH,'F')}
    doc.setDrawColor(210,230,210);doc.line(ml,y+rowH,ml+W,y+rowH);
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(GREEN.r,GREEN.g,GREEN.b);
    doc.text(String(item.num),ml+6,y+5.5,{align:'center'});
    doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(30,30,30);
    docLines.forEach((l,li)=>doc.text(l,ml+14,y+5+li*4.5));
    doc.setFont('helvetica','normal');doc.setFontSize(7);
    descLines.forEach((l,li)=>doc.text(l,ml+64,y+5+li*4.5));
    const st=formData.doc_status&&formData.doc_status[i]||'';
    doc.setFont('helvetica','bold');doc.setFontSize(9);
    if(st==='C'){doc.setTextColor(GREEN.r,GREEN.g,GREEN.b);doc.text('C',ml+W-28,y+6,{align:'center'})}
    if(st==='NC'){doc.setTextColor(RED.r,RED.g,RED.b);doc.text('NC',ml+W-12,y+6,{align:'center'})}
    doc.setTextColor(30,30,30);y+=rowH;
  });

  // 6.1 Observações da documentação
  if(formData.doc_obs){
    y+=4;checkY(16);
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(NAVY.r,NAVY.g,NAVY.b);
    doc.text('6.1 OBSERVAÇÕES',ml,y);y+=6;
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(30,30,30);
    doc.splitTextToSize(formData.doc_obs,W).forEach(l=>{checkY(6);doc.text(l,ml,y);y+=5.5});
  }

  // Observações Gerais
  addPage();
  secTitle('6.1   OBSERVAÇÕES');
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(30,30,30);
  doc.splitTextToSize(formData.observacoes||'',W).forEach(l=>{checkY(6);doc.text(l,ml,y);y+=5.5});
  y+=8;

  // Section 7 — Ferramentas e Calibração
  addPage();secTitle('7.0 – FERRAMENTAS E CALIBRAÇÃO DOS EQUIPAMENTOS.');
  const fFerr=formData.fotos_ferramentas||[];
  if(fFerr.length>0){
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(NAVY.r,NAVY.g,NAVY.b);
    doc.text('FOTOS DAS FERRAMENTAS DA EQUIPE:',ml,y);y+=6;
    // 2-column grid for tool photos
    const imgW2=(W-6)/2;
    for(let fi=0;fi<fFerr.length;fi+=2){
      const rowH=55;checkY(rowH+10);
      try{if(fFerr[fi].src)doc.addImage(fFerr[fi].src,'JPEG',ml,y,imgW2,rowH)}catch(e){}
      try{if(fFerr[fi+1]&&fFerr[fi+1].src)doc.addImage(fFerr[fi+1].src,'JPEG',ml+imgW2+6,y,imgW2,rowH)}catch(e){}
      y+=rowH+5;
      doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(NAVY.r,NAVY.g,NAVY.b);
      const leg1=fFerr[fi].legenda||'';const leg2=fFerr[fi+1]?fFerr[fi+1].legenda||'':'';
      if(leg1)doc.text(leg1,ml+imgW2/2,y,{align:'center'});
      if(leg2)doc.text(leg2,ml+imgW2+6+imgW2/2,y,{align:'center'});
      y+=10;
    }
  }
  if(formData.obs_ferramental){
    checkY(16);
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(NAVY.r,NAVY.g,NAVY.b);
    doc.text('7.1 – OBSERVAÇÕES DO FERRAMENTAL:',ml,y);y+=7;
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(30,30,30);
    doc.splitTextToSize(formData.obs_ferramental,W).forEach(l=>{checkY(6);doc.text(l,ml,y);y+=5.5});
  }
  y+=8;

  // ===== SEÇÕES 8+ — numeração dinâmica =====
  // 8.3 vem logo após 8.2 (fotos do caminhão de cada equipe)
  // Obs. Gerais VCTE vem após 10.0 — só se houver texto
  // 11.0 Conclusão e 12.0 Equipe mantêm numeração fixa

  // Section 8 — Veículos
  addPage();secTitle('8.0   VEÍCULOS');
  doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(NAVY.r,NAVY.g,NAVY.b);
  doc.text('8.1 CAMINHÕES APRESENTADOS NA VCTE',ml,y);y+=10;

  // Helper para renderizar laudos (pdf.js)
  async function renderLaudos(){
    const laudos=formData.laudos_guindauto||[];
    if(!laudos.length)return;
    for(const laudo of laudos){
      if(!laudo.dataUrl)continue;
      try{
        const pdfjsLib=window['pdfjs-dist/build/pdf'];
        if(pdfjsLib){
          pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          const pdfDoc=await pdfjsLib.getDocument(laudo.dataUrl).promise;
          for(let pg=1;pg<=pdfDoc.numPages;pg++){
            const page=await pdfDoc.getPage(pg);
            const scale=2;const vp=page.getViewport({scale});
            const canvas=document.createElement('canvas');
            canvas.width=vp.width;canvas.height=vp.height;
            const ctx=canvas.getContext('2d');
            await page.render({canvasContext:ctx,viewport:vp}).promise;
            const imgData=canvas.toDataURL('image/jpeg',0.92);
            const ratio=vp.height/vp.width;
            const pdfImgW=W;const pdfImgH=Math.min(pdfImgW*ratio,ph-HDR_H-20);
            checkY(pdfImgH+4);
            doc.addImage(imgData,'JPEG',ml,y,pdfImgW,pdfImgH);
            y+=pdfImgH+4;
            if(pg<pdfDoc.numPages)addPage();
          }
        } else {
          checkY(30);
          doc.setDrawColor(200,220,200);doc.setLineWidth(0.5);doc.rect(ml,y,W,20,'D');
          doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(GRAY.r,GRAY.g,GRAY.b);
          doc.text('Documento PDF — arquivo original deve ser anexado.',ml+W/2,y+12,{align:'center'});
          doc.setLineWidth(0.2);y+=28;
        }
      }catch(e){
        checkY(14);
        doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(GRAY.r,GRAY.g,GRAY.b);
        doc.text('Arquivo PDF referenciado — anexar ao processo.',ml,y);y+=10;
      }
    }
  }

  // 8.2 + 8.3 por equipe
  const eqCampo=formData.equipes_campo||[];
  for(let ei=0;ei<eqCampo.length;ei++){
    const eq=eqCampo[ei];
    checkY(16);
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(NAVY.r,NAVY.g,NAVY.b);
    doc.text(`8.2 APRESENTAÇÃO DO CAMINHÃO EQUIPE ${ei+1}`,ml,y);y+=8;
    const vW2=[W*0.25,W*0.25,W*0.25,W*0.25];
    tHeader(['Placa do Veículo:','Ano do Veículo:','Marca:','Modelo:'],vW2);
    tRow([eq.placa,eq.ano_veiculo,eq.marca,eq.modelo],vW2,false);y+=2;
    tHeader(['Fabricante Cab. Aux.:','Ano Fab./Nº de Série:','Fabricante Guindauto/Modelo','Ano Fab./Nº de Série Guind.'],vW2);
    tRow([eq.fab_cab,eq.ano_cab,eq.fab_guindauto,eq.ano_guindauto],vW2,false);y+=2;
    tHeader(['Veículo Locado?','Fab. Cesto Acoplado:','',''],vW2);
    tRow([eq.locado,eq.fab_cesto,'',''],vW2,false);y+=6;
    // Fotos do caminhão (2 por linha)
    const fCam=eq.fotos_caminhao||[];
    if(fCam.length>0){
      const imgWc=(W-6)/2;
      for(let fi=0;fi<fCam.length;fi+=2){
        const rH2=55;checkY(rH2+10);
        try{if(fCam[fi].src)doc.addImage(fCam[fi].src,'JPEG',ml,y,imgWc,rH2)}catch(e){}
        try{if(fCam[fi+1]&&fCam[fi+1].src)doc.addImage(fCam[fi+1].src,'JPEG',ml+imgWc+6,y,imgWc,rH2)}catch(e){}
        y+=rH2+5;
        doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(GRAY.r,GRAY.g,GRAY.b);
        if(fCam[fi].legenda)doc.text(fCam[fi].legenda,ml+imgWc/2,y,{align:'center'});
        if(fCam[fi+1]&&fCam[fi+1].legenda)doc.text(fCam[fi+1].legenda,ml+imgWc+6+imgWc/2,y,{align:'center'});
        y+=10;
      }
    }
    y+=4;
    // 8.3 Laudo logo após as fotos desta equipe — sempre em página nova
    if((formData.laudos_guindauto||[]).length>0){
      addPage();
      doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(NAVY.r,NAVY.g,NAVY.b);
      doc.text('8.3 LAUDO TÉCNICO DE INSPEÇÃO DO GUINDAUTO',ml,y);
      doc.setDrawColor(GREEN.r,GREEN.g,GREEN.b);doc.setLineWidth(0.5);
      doc.line(ml,y+2,ml+W,y+2);doc.setLineWidth(0.2);y+=10;
      await renderLaudos();
    }
  }

  // 9. Veículos de apoio
  const vApoio=formData.veiculos_apoio||[];
  if(vApoio.length>0){
    addPage();
    doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(NAVY.r,NAVY.g,NAVY.b);
    doc.text('9. VEÍCULOS DE APOIO',ml,y);y+=10;
    vApoio.forEach(v=>{
      const fAp=v.fotos||[];
      if(fAp.length>0){
        const imgWa=(W-6)/2;
        for(let fi=0;fi<fAp.length;fi+=2){
          checkY(58);
          try{if(fAp[fi].src)doc.addImage(fAp[fi].src,'JPEG',ml,y,imgWa,50)}catch(e){}
          try{if(fAp[fi+1]&&fAp[fi+1].src)doc.addImage(fAp[fi+1].src,'JPEG',ml+imgWa+6,y,imgWa,50)}catch(e){}
          y+=55;
          doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(GRAY.r,GRAY.g,GRAY.b);
          if(fAp[fi].legenda)doc.text(fAp[fi].legenda,ml+imgWa/2,y,{align:'center'});
          if(fAp[fi+1]&&fAp[fi+1].legenda)doc.text(fAp[fi+1].legenda,ml+imgWa+6+imgWa/2,y,{align:'center'});
          y+=10;
        }
      }
    });
    y+=6;
  }

  // 10.0 Descrição Geral dos Veículos
  addPage();secTitle('10.0   DESCRIÇÃO GERAL DOS VEÍCULOS:');
  eqCampo.forEach((eq,ei)=>{
    checkY(20);
    doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(NAVY.r,NAVY.g,NAVY.b);
    doc.text(`VEÍCULO PESADO EQUIPE ${ei+1}:`,ml,y);y+=6;
    const dW2=[W/2,W/2];
    tHeader([`Modelo: ${eq.marca||''} ${eq.modelo||''}`,`Placa: ${eq.placa||''}`],dW2);y+=2;
    tHeader([`Ano de fabricação: ${eq.ano_veiculo||'—'}`,' '],dW2);y+=6;
  });
  vApoio.forEach(v=>{
    checkY(20);
    doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(NAVY.r,NAVY.g,NAVY.b);
    doc.text('VEÍCULO MÉDIO PARA TRANSPORTE DA EQUIPE E APOIO A OBRA:',ml,y);y+=6;
    const dW3=[W/2,W/2];
    tHeader([`Modelo: ${v.modelo||'—'}`,`Equipe: ${v.equipe||'APOIO'}`],dW3);y+=2;
    tHeader([`Ano de fabricação: ${v.ano||'—'}`,`Placa: ${v.placa||'—'}`],dW3);y+=6;
  });
  if(formData.desc_veiculos_obs){
    y+=4;doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(30,30,30);
    doc.splitTextToSize(formData.desc_veiculos_obs,W).forEach(l=>{checkY(6);doc.text(l,ml,y);y+=5.5});
  }

  // Obs. Gerais da VCTE — só se houver texto, logo após 10.0
  // Numeração: com obs_vcte → 11.0=obs, 12.0=conclusão, 13.0=equipe
  //            sem obs_vcte → 11.0=conclusão, 12.0=equipe
  const hasObsVcte=!!(formData.obs_vcte&&formData.obs_vcte.trim());
  const nConc=hasObsVcte?12:11;
  const nEq=hasObsVcte?13:12;

  if(hasObsVcte){
    addPage();
    secTitle('11.0   OBSERVAÇÕES GERAIS DA VCTE');
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(30,30,30);
    doc.splitTextToSize(formData.obs_vcte,W).forEach(l=>{checkY(6);doc.text(l,ml,y);y+=5.5});
    y+=6;
  }

  // Conclusão
  addPage();secTitle(`${nConc}.0   CONCLUSÃO:`);
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(30,30,30);
  doc.splitTextToSize(formData.conclusao||'',W).forEach(l=>{checkY(6);doc.text(l,ml,y);y+=5.5});
  y+=12;

  // Equipe Responsável
  addPage();secTitle(`${nEq}.0   EQUIPE RESPONSÁVEL PELO EVENTO:`);
  formData.equipe_envolvida.forEach(m=>{
    if(m.nome){checkY(6);doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(30,30,30);doc.text(`${m.nome}${m.regional?' '+m.regional:''}`,ml,y);y+=6}
  });
  y+=16;

  // Assinaturas
  checkY(36);
  doc.setDrawColor(100,100,100);doc.setLineWidth(0.4);
  const sig1x=ml,sig2x=ml+W/2+10,sigW=W/2-10;
  doc.line(sig1x,y,sig1x+sigW,y);doc.line(sig2x,y,sig2x+sigW,y);y+=5;
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(NAVY.r,NAVY.g,NAVY.b);
  doc.text('CEMIG DISTRIBUIÇÃO S.A.',sig1x,y);
  doc.text(formData.razao_social||'EMPRESA VERIFICADA',sig2x,y);y+=5;
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(GRAY.r,GRAY.g,GRAY.b);
  doc.text(formData.responsavel_cemig||'',sig1x,y);
  doc.text(formData.responsavel_empresa||'',sig2x,y);

  // Footer em todas as páginas
  const totalPgs=doc.getNumberOfPages();
  for(let p=1;p<=totalPgs;p++){
    doc.setPage(p);
    doc.setFillColor(NAVY.r,NAVY.g,NAVY.b);doc.rect(0,ph-10,pw,10,'F');
    doc.setDrawColor(GREEN2.r,GREEN2.g,GREEN2.b);doc.setLineWidth(0.4);doc.line(0,ph-10,pw,ph-10);
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(GLIGHT.r,GLIGHT.g,GLIGHT.b);
    doc.text(`Página ${p} de ${totalPgs}`,pw-mr,ph-4,{align:'right'});
    doc.setLineWidth(0.2);
  }

  saveReport();
  const fn=`VCTE_${formData.numero_vcte||'N'}_${formData.ano||''}_${(formData.razao_social||'relatorio').replace(/\s+/g,'_').substring(0,20)}.pdf`;
  doc.save(fn);showToast('PDF gerado com sucesso! ✓','success');
}

function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function formatDate(d){if(!d)return'—';try{const[y,m,day]=d.split('-');return`${day}/${m}/${y}`}catch{return d}}
function showToast(msg,type=''){
  const t=document.getElementById('toast');t.textContent=msg;
  t.className='show'+(type?' '+type:'');clearTimeout(t._timer);
  t._timer=setTimeout(()=>{t.className=''},3500);
}
</script>
</body>
</html>
